# The repo is private on a free plan, so branch protection is unavailable. These checks replace it.
# The push check lives in its own file so that a pull request run has no skipped check.
name: repo-guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  # pull_request_target runs this file from the default branch. The branches filter runs before
  # checkout.
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base is the main branch
        env:
          GUARD_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guard-agents.sh pr-base "$BASE_REF"
      - name: Body says Part of #N and closes no issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/guard-agents.sh pr-body
      - name: No commit closes an issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/guard-agents.sh pr-commits "$BASE_SHA" "$HEAD_SHA"
      - name: guard-agents.sh is the canonical vws-deploy copy
        run: scripts/guard-agents.sh identity scripts/guard-agents.sh.sha256
      - name: AGENTS.md has the guardrails
        run: scripts/guard-agents.sh agents

  # github.base_ref is the base branch name, so the only allowed if is that equality.
  # GitHub evaluates it before checkout.
  verify-gate:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Approved for this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GUARD_VERIFY_ACTORS: ${{ vars.VWS_VERIFY_ACTORS }}
          GUARD_VERIFY_IDENTITY: ${{ vars.VWS_VERIFY_IDENTITY }}
        run: |
          set -euo pipefail
          # Labels as they are now, not the event snapshot (a re-run replays the original event).
          label_json=$(gh api "repos/${REPO}/issues/${NUMBER}/labels")
          if ! jq -e 'any(.[]; .name=="verify-approved")' <<<"$label_json" >/dev/null; then
            echo "verify-gate: the pull request has no 'verify-approved' label" >&2
            exit 1
          fi
          LABELS=$(jq -r '.[].name' <<<"$label_json")
          text=$(mktemp)
          comments=$(mktemp)
          gh api --paginate "repos/${REPO}/issues/${NUMBER}/comments" \
            --jq '.[] | {login: .user.login, body: .body} | @json' >"$comments"
          : >"$text"
          while IFS= read -r row; do
            [[ -n $row ]] || continue
            login=$(jq -r '.login' <<<"$row")
            body=$(jq -r '.body // ""' <<<"$row")
            norm=$(printf '%s' "$body" | scripts/guard-agents.sh normalize-comment)
            printf '@@comment-by: %s\n%s\n' "$login" "$norm" >>"$text"
          done <"$comments"
          GUARD_VERIFY_LABELER=$(gh api --paginate "repos/${REPO}/issues/${NUMBER}/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "verify-approved") | [.created_at, .actor.login] | @tsv' \
            | scripts/guard-agents.sh latest-labeler)
          # The head pusher: the actor of the activity that set the head ref to HEAD_SHA (repository activity
          # API; push, force push, branch creation...), not the commit's committer field, which anyone can set.
          # No match fails closed. The committer's linked login stays excluded as well.
          pusher=$(gh api -X GET "repos/${HEAD_REPO}/activity" -f ref="refs/heads/${HEAD_REF}" -F per_page=100 \
            --jq "[.[] | select(.after == \"${HEAD_SHA}\")][0].actor.login // \"\"")
          if [[ -z $pusher ]]; then
            echo "verify-gate: no push of ${HEAD_SHA} to ${HEAD_REPO} ${HEAD_REF} found; cannot tell who pushed the head" >&2
            exit 1
          fi
          committer=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.committer.login // ""')
          GUARD_VERIFY_EXCLUDE="${PR_AUTHOR},${pusher},${committer}"
          export GUARD_VERIFY_LABELER GUARD_VERIFY_EXCLUDE
          gh auth setup-git
          # head-pin-start
          # refs/pull/N/head moves when someone pushes. HEAD_SHA is the commit on this event.
          [[ ${HEAD_SHA} =~ ^[0-9a-f]{40}$ ]] || {
            echo "verify-gate: HEAD_SHA is not a full sha" >&2
            exit 1
          }
          git fetch --depth=1 origin "$HEAD_SHA"
          got=$(git rev-parse FETCH_HEAD)
          if [[ $got != "$HEAD_SHA" ]]; then
            echo "verify-gate: fetched ${got}, wanted ${HEAD_SHA}" >&2
            exit 1
          fi
          # head-pin-end
          # bootstrap-guard-start
          guard=scripts/guard-agents.sh
          sum=scripts/guard-agents.sh.sha256
          if [[ ! -f $guard || ! -f $sum ]]; then
            echo "verify-gate: base has no scripts/guard-agents.sh; refusing the PR head copy" >&2
            exit 1
          fi
          # bootstrap-guard-end
          # ALLOWFILE is this checkout. HEAD_SHA is the only commit allow and verify-gate judge.
          scripts/guard-agents.sh allow scripts/guard-allowed.sha256 "$HEAD_SHA"
          scripts/guard-agents.sh identity "$sum"
          scripts/guard-agents.sh verify-gate "$HEAD_SHA" "$LABELS" "$text"

  verify-reset:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove verify-approved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if jq -e 'any((. // [])[]; . == "verify-approved")' <<<"${LABELS_JSON}" >/dev/null; then
            if out=$(gh api -X DELETE "repos/${REPO}/issues/${NUMBER}/labels/verify-approved" 2>&1); then
              echo "verify-approved removed: a new head needs a new verification"
            elif [[ $out == *"HTTP 404"* ]]; then
              echo "verify-approved was already removed"
            else
              echo "$out" >&2
              exit 1
            fi
          fi
