name: ci

on:
  push:
  pull_request:

jobs:
  # Guard self-tests and the AGENTS.md checks always run. The Go steps run once the module exists
  # (the harness lands in a separate pull request); until then they report that there is no module.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install pinned PyYAML
        run: python3 -m pip install --user --require-hashes -r scripts/requirements-guard.txt
      - run: scripts/guard-agents.sh selftest
      - run: scripts/guard-agents.sh agents
      - run: scripts/guard-agents.sh rules
      - name: Go tests
        run: |
          if [ ! -f go.mod ]; then echo "no go.mod yet: nothing to test"; exit 0; fi
          go test -race -count=1 -timeout 300s ./...

  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: |
          if [ ! -f go.mod ]; then echo "no go.mod yet: nothing to lint"; exit 0; fi
          golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: |
          if [ ! -f go.mod ]; then echo "no go.mod yet: nothing to format"; exit 0; fi
          golangci-lint fmt --diff
